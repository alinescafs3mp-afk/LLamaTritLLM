name: Trit Studio checks
on:
  push:
    paths: ['trit-studio/**', '.github/workflows/tritstudio.yml']
  pull_request:
    paths: ['trit-studio/**', '.github/workflows/tritstudio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: trit-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build CPU solution
        run: dotnet build TritStudio.sln -c Release -p:TorchBackend=cpu
      - name: Core and corpus tests
        run: dotnet run --project tests/TritStudio.Tests -c Release --no-build
      - name: Headless UI feedback tests
        run: dotnet run --project tests/TritStudio.UiTests -c Release --no-build
      - name: Real CPU trainer test
        run: dotnet run --project src/TritStudio.Trainer -c Release --no-build -- --self-test
      - name: Isolated native CPU benchmark
        run: dotnet run --project src/TritStudio.Trainer -c Release --no-build -- --benchmark
      - name: Real worker lifecycle (Linux)
        if: runner.os == 'Linux'
        run: dotnet run --project tests/TritStudio.Tests -c Release --no-build -- --worker "$PWD/src/TritStudio.Trainer/bin/Release/net10.0/TritStudio.Trainer"
      - name: Real worker lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet run --project tests/TritStudio.Tests -c Release --no-build -- --worker "$PWD/src/TritStudio.Trainer/bin/Release/net10.0/TritStudio.Trainer.exe"
